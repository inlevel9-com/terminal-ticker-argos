# Checks on every push and PR; npm publish when a v* tag is pushed.
#
# Release: bump "version" in package.json, merge, then
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match the package version or the job fails before publishing.
#
# Auth: npm trusted publishing (OIDC, no stored token) once it is configured on
# npmjs.com for this repo + workflow; until then the NPM_TOKEN secret of the
# `npm` environment is used.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the packed CLI
        run: |
          npm pack --silent
          npm install -g ./inlevel9-argos-*.tgz
          argos --version
          argos --help | head -3

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - name: Tag matches package version
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$pkg"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
